name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  quality:
    name: Typecheck · Lint · Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      # O postinstall gera o Prisma Client (não requer banco).
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

  integration:
    name: Build · API integration · E2E
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: medfacil
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d medfacil"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/medfacil?schema=public
      APP_URL: http://localhost:3000
      DEMO_SHOW_RESET_LINK: "true"
      # Limites folgados apenas para a suíte automatizada (padrão em produção = 1).
      RATE_LIMIT_MULTIPLIER: "50"
      SEED_ADMIN_EMAIL: admin@medfacil.demo
      SEED_ADMIN_PASSWORD: Admin@12345
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Gerar segredo JWT efêmero
        run: |
          secret="$(openssl rand -base64 48 | tr -d '\n')"
          echo "::add-mask::$secret"
          echo "JWT_ACCESS_SECRET=$secret" >> "$GITHUB_ENV"

      - run: npm ci
      - name: Migrações e seed
        run: |
          npx prisma migrate deploy
          npm run db:seed

      - name: Build de produção
        run: npm run build

      - name: Iniciar servidor standalone (mesmo artefato da imagem Docker)
        run: |
          cp -r .next/static .next/standalone/.next/static
          cp -r public .next/standalone/public 2>/dev/null || true
          (cd .next/standalone && PORT=3000 HOSTNAME=127.0.0.1 node server.js > ../../server.log 2>&1 &)
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:3000/api/health && exit 0
            sleep 2
          done
          echo "Servidor não respondeu ao health check" && cat server.log && exit 1

      - name: Testes de integração da API
        run: npm run test:api
        env:
          API_BASE_URL: http://localhost:3000

      - name: Restaurar dados de demonstração
        run: npm run db:seed

      - name: Instalar Chromium (Playwright)
        run: npx playwright install --with-deps chromium

      - name: Testes E2E
        run: npm run test:e2e
        env:
          E2E_BASE_URL: http://localhost:3000

      - name: Logs do servidor
        if: failure()
        run: cat server.log 2>/dev/null || echo "Servidor não chegou a ser iniciado."

      - name: Relatório do Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
